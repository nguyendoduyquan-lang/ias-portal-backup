<style>

<script>
'use strict';
let lang='vi';try{const sv=localStorage.getItem('ias-lang');if(sv)lang=sv}catch(e){}
const L=(vi,en)=>lang==='vi'?vi:en;
const P=a=>Array.isArray(a)?a[lang==='vi'?0:1]:a;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<span class="ms" aria-hidden="true">${n}</span>`;
const bt=(i,t)=>`${ic(i)}<span>${t}</span>`;
const note=(t,k,i)=>`<div class="note ${k||''}">${ic(i||(k==='warn'?'warning':k==='ok'?'check_circle':'info'))}<div>${t}</div></div>`;
const empty=(i,t,d)=>`<div class="empty">${ic(i)}<b>${t}</b>${d?`<span class="small">${d}</span>`:''}</div>`;

const DAY=864e5;const now=()=>Date.now();
const TZ='Asia/Ho_Chi_Minh';
const fmt=(t,tm)=>t?new Date(t).toLocaleString(lang==='vi'?'vi-VN':'en-GB',{timeZone:TZ,day:'2-digit',month:lang==='vi'?'2-digit':'short',year:'numeric',...(tm?{hour:'2-digit',minute:'2-digit'}:{})}):'–';
const dstr=t=>t?new Date(t).toLocaleDateString('sv-SE',{timeZone:TZ}):'';
const H=s=>{let x=5381;for(const c of String(s)){x=((x<<5)+x+c.charCodeAt(0))>>>0}return x.toString(16).padStart(8,'0')};
const rnd=(n=24)=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(b=>b.toString(36).padStart(2,'0')).join('').slice(0,n)};
const words=s=>String(s||'').trim()?String(s).trim().split(/\s+/).length:0;
const uid=p=>p+rnd(8);
const toIn=t=>t?dstr(t):'';
const fromIn=(v,end)=>v?Date.parse(v+(end?'T23:59:59+07:00':'T00:00:00+07:00')):null;
const pad=(n,k=4)=>String(n).padStart(k,'0');

const linkErr=u=>{try{const x=new URL(u);if(x.protocol!=='https:')return L('Liên kết phải bắt đầu bằng https://','Must start with https://');if(!/(^|\.)(drive|docs)\.google\.com$/.test(x.hostname))return L('Chỉ nhận liên kết Google Drive.','Only Google Drive links allowed.');return''}catch(e){return L('Liên kết không hợp lệ.','Invalid link.')}};
const linkName=u=>{const m=String(u).match(/\/d\/([\w-]{6,})|[?&]id=([\w-]{6,})/);return 'Drive · '+(m?(m[1]||m[2]).slice(0,10)+'…':L('liên kết','link'))};

let toastT;function toast(m,err){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3600)}

const ROLE={author:['Tác giả','Author'],editor:['Biên tập viên','Editor'],lead_editor:['Phụ trách Ban biên tập','Editor-in-Chief'],head:['Chủ nhiệm Dự án','Project Director'],admin:['Quản trị','Administrator']};
const STAFF=['editor','lead_editor','head','admin'];
const ST={draft:['Bản nháp','Draft',''],submitted:['Đã nộp','Submitted','info'],screening:['Kiểm tra sơ bộ','Initial screening','info'],under_review:['Đang phản biện','Under review','info'],accepted:['Chấp nhận','Accepted','ok'],rejected:['Từ chối','Rejected','bad']};
const st=s=>`<span class="st ${ST[s]?ST[s][2]:''}"><i></i>${P(ST[s]||['—','—'])}</span>`;
const AST={draft:['Bản nháp','Draft',''],submitted:['Đã nộp','Submitted','info'],screening:['Đang thẩm định','Under screening','info'],passed_to_presentation:['Thông qua trình bày','Passed to presentation','warn'],approved:['Đã phê duyệt','Approved','ok'],rejected:['Không phê duyệt','Declined','bad'],withdrawn:['Đã rút','Withdrawn','']};
const ast=s=>`<span class="st ${AST[s]?AST[s][2]:''}"><i></i>${P(AST[s]||['—','—'])}</span>`;
const CALLST={draft:['Bản nháp','Draft',''],coming_soon:['Sắp mở','Coming soon','warn'],open:['Đang mở','Open','ok'],closed:['Đã đóng','Closed','bad']};
const MODE={double_blind:['Kín hai chiều','Double-blind'],single_blind:['Kín một chiều','Single-blind'],none:['Không phản biện','No review']};

const CC0=[
  {key:'by',name:'CC BY 4.0',url:'https://creativecommons.org/licenses/by/4.0/',d:['Tự do chia sẻ và chỉnh sửa, kể cả thương mại, có ghi công.','Attribution required.']},
  {key:'by-sa',name:'CC BY-SA 4.0',url:'https://creativecommons.org/licenses/by-sa/4.0/',d:['Tự do sử dụng, tác phẩm phái sinh cùng giấy phép.','Attribution-ShareAlike.']},
  {key:'by-nc',name:'CC BY-NC 4.0',url:'https://creativecommons.org/licenses/by-nc/4.0/',d:['Sử dụng phi thương mại, có ghi công tác giả.','Non-commercial with credit.']},
  {key:'by-nc-sa',name:'CC BY-NC-SA 4.0',url:'https://creativecommons.org/licenses/by-nc-sa/4.0/',d:['Phi thương mại, tác phẩm phái sinh chia sẻ tương tự.','Non-commercial ShareAlike.']},
  {key:'by-nd',name:'CC BY-ND 4.0',url:'https://creativecommons.org/licenses/by-nd/4.0/',d:['Chia sẻ nguyên bản có ghi công, không tạo tác phẩm phái sinh.','No derivatives.']},

];

function nextCycle(t){
  const d=new Date(t);let y=d.getUTCFullYear();
  const cyc=(DB.settings&&DB.settings.projectCycles)||CYC;
  for(let k=0;k<4;k++){
    for(const m of cyc){
      const c=Date.UTC(y,m,15);
      if(c>t)return{t:c,label:`${pad(m+1,2)}/${y}`};
    }
    y++;
  }
}
const cdText=ms=>{if(ms<=0)return L('đã đến hạn','due');const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/36e5);return `${d}${L(' ngày ',' d ')}${h}${L(' giờ',' h')}`};

const emptyCall=()=>({id:uid('c'),slug:'',typeKey:'shcm_full',title:['',''],desc:['',''],scope:'',status:'open',opens:toIn(now()),closes:toIn(now()+60*DAY),abstractDeadline:'',fulltextDeadline:'',reviewDays:20,minOverride:'',schedule:'',externalUrl:''});
function hydrateCall(c){
  const T=()=>typeOf(c.typeKey)||{};
  Object.defineProperties(c,{
    type:{get:T,enumerable:false,configurable:true},
    mode:{get:()=>T().mode||'none',enumerable:false,configurable:true}
  });
  return c;
}

const API={};
API.newDraft=(u,callId)=>{
  const c=DB.calls.find(x=>x.id===callId);
  if(!c||c.status!=='open')fail('Đợt nộp hiện đang đóng.','Call is closed.');
  if(typeOf(c.typeKey)?.who==='members'&&!u.member)fail('Chuyên mục này chỉ dành riêng cho thành viên IAS.','This call is for IAS members only.');
  const s={id:uid('s'),code:'NHÁP-'+pad(++DB.seq.draft),callId,typeKey:c.typeKey,authorId:u.id,title:'',abstract:'',keywords:[],lang:u.lang||'vi',fields:[],fieldOther:'',lead:{aff:u.aff||''},authors:[],corresponding:0,pen:'',minor:'no',minorAge:'',guardian:{},prior:'no',priorNote:'',ai:'',coi:'',license:'by',ccWarranty:false,agree:false,status:'draft',onHold:false,created:now(),editorId:null,manuscriptFile:'',annexLink:'',history:[]};
  DB.subs.push(s);audit('create',{actor:u,target:s.code});return s;
};

API.submitFull=(s,u)=>{
  if(!s.title||!s.title.trim())fail('Vui lòng nhập tiêu đề bài viết.','Title required.');
  if(!s.manuscriptFile||!s.manuscriptFile.trim())fail('Vui lòng dán liên kết Google Drive của bản thảo.','Manuscript Drive link required.');
  const lErr=linkErr(s.manuscriptFile);if(lErr)fail(lErr,lErr);
  if(!s.license)fail('Vui lòng lựa chọn giấy phép Creative Commons (CC) áp dụng cho bài viết.','CC license selection required.');
  if(!s.ccWarranty)fail('Vui lòng xác nhận quyền cấp phép bản quyền đối với bài viết.','License warranty confirmation required.');
  if(!s.agree)fail('Vui lòng tích chọn đồng ý cam kết thỏa thuận tác giả.','Agreement confirmation required.');
  if(s.code.startsWith('NHÁP'))s.code=nextCode();
  s.status='screening';s.history.push({t:now(),from:'draft',to:'screening',by:u.email});
  const eds=DB.users.filter(x=>x.role==='editor');s.editorId=eds.length?eds[0].id:null;
  audit('submit',{actor:u,target:s.code});return s;
};

API.appNew=(u,by)=>{
  if(!by&&DB.apps.some(x=>x.userId===u.id&&ACTIVE_APP.includes(x.status)))fail('Đang có một hồ sơ đang xử lý. Mỗi người chỉ có một hồ sơ đang xử lý; nếu hồ sơ bị từ chối thì được nộp lại.','You already have an active application.');
  const a={id:uid('a'),code:nextAppCode(),userId:u.id,title:'',topic:'',objectives:'',months:12,advisor:'',advisorOk:false,fields:['502'],fieldOther:'',applicant:{name:u.name,email:u.email,major:'',unit:u.aff||'',cohort:'',phone:''},cvLink:'',planLink:'',staffLink:'',staffNone:false,agree:false,commitNote:'',status:'draft',history:[],notes:[],created:now(),stateSince:now(),proxy:by?by.email:null};
  DB.apps.push(a);audit('app:create',{actor:by||u,target:a.code});return a;
};

API.appSubmit=(a,u)=>{
  const ap=a.applicant||{};
  if(!ap.name?.trim()||!ap.email?.trim()||!ap.major?.trim()||!ap.unit?.trim()||!ap.cohort?.trim()||!ap.phone?.trim())fail('Vui lòng điền đầy đủ thông tin Chủ nhiệm Dự án (Họ tên, Email, Ngành, Đơn vị, Niên khóa, SĐT).','Applicant details incomplete.');
  if(!a.title?.trim()||!a.topic?.trim()||!a.objectives?.trim())fail('Vui lòng điền đầy đủ Tên Dự án, Tên đề tài và Mục tiêu tổng quát.','Project info incomplete.');
  if(!a.cvLink?.trim()||!a.planLink?.trim())fail('Vui lòng cung cấp link Google Drive Lý lịch khoa học và Kế hoạch thực hiện.','CV and Plan Drive links required.');
  if(!a.staffNone&&!a.staffLink?.trim())fail('Vui lòng cung cấp link Báo cáo nhu cầu nhân sự hoặc tích chọn "Không có nhu cầu tuyển".','Staffing link or none required.');
  if(!a.agree)fail('Vui lòng đọc và tích chọn đồng ý toàn bộ điều khoản cam kết của Chủ nhiệm Dự án.','Commitment agreement required.');
  a.status='submitted';a.cycle=nextCycle(now()).label;a.stateSince=now();a.history.push({t:now(),from:'draft',to:'submitted',by:u.email});
  audit('app:submit',{actor:u,target:a.code});return a;
};

API.appMove=(a,to,u,note)=>{
  a.history.push({t:now(),from:a.status,to,by:u.email,note:note||''});
  a.status=to;a.stateSince=now();
  if(to==='approved'||to==='rejected')a.decision={at:now(),by:u.email,note:note||'',result:to};
  audit('app:'+to,{actor:u,target:a.code,detail:note||''});return a;
};

API.callSave=(u,c)=>{
  if(u.role!=='admin'&&!ED.includes(u.role))fail('Không có quyền.','Permission denied.');
  if(!c.slug||!c.t0)fail('Vui lòng nhập slug và tên đợt nộp.','Slug and title required.');
  let cur=DB.calls.find(x=>x.id===c.id);
  const data = {
    slug:c.slug,title:[c.t0,c.t1||c.t0],desc:[c.d0||'',c.d1||''],scope:c.scope||'',typeKey:c.typeKey,status:c.status,
    opens:fromIn(c.opens),closes:fromIn(c.closes,true),abstractDeadline:fromIn(c.abstractDeadline,true),fulltextDeadline:fromIn(c.fulltextDeadline,true),
    reviewDays:+c.reviewDays||20,minOverride:c.minOverride===''?null:+c.minOverride,schedule:c.schedule||'',externalUrl:c.externalUrl||''
  };
  if(cur){
    Object.assign(cur,data);audit('call:update',{actor:u,target:cur.slug});
  }else{
    const nc=hydrateCall({...emptyCall(),...data,id:uid('c')});
    DB.calls.push(nc);audit('call:create',{actor:u,target:nc.slug});
  }
};

API.callDelete=(u,id)=>{
  if(u.role!=='admin')fail('Chỉ Quản trị viên mới được xóa đợt.','Admin only.');
  const idx=DB.calls.findIndex(x=>x.id===id);
  if(idx>=0){const slug=DB.calls[idx].slug;DB.calls.splice(idx,1);audit('call:delete',{actor:u,target:slug});}
};

API.userSave=(u,d)=>{
  if(u.role!=='admin')fail('Chỉ Quản trị viên mới được quản lý tài khoản.','Admin only.');
  if(!d.email||!d.name)fail('Vui lòng nhập tên và email.','Name and email required.');
  let target=DB.users.find(x=>x.id===d.id);
  if(target){
    target.name=d.name;target.role=d.role;target.aff=d.aff||'';
    if(d.pw)target.pw=H(d.pw);
    audit('user:update',{actor:u,target:target.email});
  }else{
    if(DB.users.some(x=>x.email.toLowerCase()===d.email.toLowerCase()))fail('Email này đã tồn tại.','Email already exists.');
    const nu={id:uid('u'),role:d.role,name:d.name,email:d.email,aff:d.aff||'',pw:H(d.pw||'IAS-123456'),created:now()};
    DB.users.push(nu);audit('user:create',{actor:u,target:nu.email});
  }
};

let WZ={step:0,id:null};
const wzSteps=(s,c)=>[['info',L('Thông tin','Details')],['authors',L('Tác giả','Authors')],['files',L('Tệp bản thảo','Files')],['decl',L('Bản quyền & Cam kết','Declarations')],['send',L('Xem lại và nộp','Review & submit')]];

const fieldPick=obj=>`
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 14px">
    ${FIELDS.map(([k,t])=>`
      <label class="chk">
        <input type="checkbox" data-act="fldTog" data-c="${k}" ${(obj.fields||[]).includes(k)?'checked':''}>
        <span>${esc(P(t))}</span>
      </label>
    `).join('')}
  </div>
  <div class="fs ${(obj.fields||[]).length&&(obj.fields||[]).length<=DB.settings.maxFields?'ok':'warn'}">
    ${(obj.fields||[]).length}/${DB.settings.maxFields} ${L('lĩnh vực đã chọn (tối đa 3)','fields chosen (max 3)')}
  </div>
`;

ACT.fldTog=a=>{
  const o=BIND.obj, c=a.dataset.c;
  o.fields=o.fields||[];
  if(o.fields.includes(c)) o.fields=o.fields.filter(x=>x!==c);
  else {
    if(o.fields.length>=DB.settings.maxFields){ toast(L('Chọn tối đa 3 lĩnh vực.','Choose at most 3 fields.')); return; }
    o.fields.push(c);
  }
  render();
};

on(/^#\/submit\/(.+)$/,(m,u)=>{

  let s=SUB(m[1]);
  const c0=DB.calls.find(x=>x.slug===m[1]);
  if(!s&&c0){
    s=DB.subs.find(x=>x.authorId===u.id&&x.callId===c0.id&&x.status==='draft');
    if(!s) s=API.newDraft(u,c0.id);
    setTimeout(()=>go('#/submit/'+s.id),0); return null;

  if(!s||s.authorId!==u.id) return notFound();

  const c=callOf(s);
  if(WZ.id!==s.id){ WZ={step:0,id:s.id}; }

ACT.appSend = () => run(() => {
  API.appSubmit(BIND.obj, me());
  toast('Đã nộp hồ sơ đăng ký thành công!');
  render();
});
ACT.appWd = a => run(async () => {
  const r = await ask({ title: L('Rút hồ sơ?', 'Withdraw?'), ok: L('Rút hồ sơ', 'Withdraw'), danger: true });
  if (!r) return;
  API.appMove(DB.apps.find(x => x.id === a.dataset.id), 'withdrawn', me(), '');
  render();
});
ACT.appStep = a => run(async () => {
  const to = a.dataset.to; let note = '';
  if (['rejected', 'approved', 'passed_to_presentation'].includes(to)) {
    const r = await ask({
      title: to === 'approved' ? L('Phê duyệt hồ sơ', 'Approve') : (to === 'rejected' ? L('Không phê duyệt hồ sơ', 'Decline') : L('Thông qua trình bày', 'Pass to presentation')),
      fields: [{ id: 'n', label: to === 'rejected' ? L('Lý do (bắt buộc)', 'Reason') : L('Ghi chú (tùy chọn)', 'Note'), type: 'textarea', req: to === 'rejected' }],
      ok: L('Xác nhận', 'Confirm'), danger: to === 'rejected'
    });
    if (!r) return;
    note = r.n;
  }
  API.appMove(BIND.obj, to, me(), note);
  toast('Đã cập nhật trạng thái hồ sơ!');
  render();
});
ACT.appNote = () => run(async () => {
  const r = await ask({ title: L('Ghi chú thẩm định', 'Note'), fields: [{ id: 'n', label: L('Nội dung', 'Content'), type: 'textarea', req: true }], ok: L('Lưu ghi chú', 'Save') });
  if (!r) return;
  BIND.obj.notes = BIND.obj.notes || [];
  BIND.obj.notes.push({ t: now(), by: me().email, text: r.n });
  audit('app:note', { actor: me(), target: BIND.obj.code });
  render();
});
ACT.appFan = () => run(() => {
  BIND.obj.fanpage = { at: now(), by: me().email };
  audit('app:fanpage', { actor: me(), target: BIND.obj.code });
  toast('Đã ghi nhận: đã đăng trên Facebook IAS.');
  render();
});

ACT.tf = a => { TF = a.dataset.k; render(); };
ACT.termNew = () => {
  TEDIT = { id: null, scope: TF === 'project' ? 'project' : 'submission', vi: '', en: '', link: '', order: DB.terms.length + 1 };
  render();
};
ACT.termEdit = a => {
  const t = DB.terms.find(x => x.id === a.dataset.id);
  if (t) {
    TEDIT = { ...t };
    render();
  }
};
ACT.termCancel = () => { TEDIT = null; render(); };
ACT.termSave = () => run(() => {
  if (!TEDIT.vi) fail('Vui lòng nhập nội dung điều khoản.', 'Term text required.');
  let cur = DB.terms.find(x => x.id === TEDIT.id);
  if (cur) {
    Object.assign(cur, TEDIT);
    audit('term:update', { actor: me(), target: cur.id });
  } else {
    const nt = { ...TEDIT, id: uid('t'), active: true };
    DB.terms.push(nt);
    audit('term:create', { actor: me(), target: nt.id });
  }
  toast('Đã lưu điều khoản!');
  TEDIT = null;
  render();
});
ACT.termDel = a => run(async () => {
  const r = await ask({ title: 'Xác nhận xóa điều khoản này?', ok: 'Xóa vĩnh viễn' });
  if (!r) return;
  const idx = DB.terms.findIndex(x => x.id === a.dataset.id);
  if (idx >= 0) {
    DB.terms.splice(idx, 1);
    audit('term:delete', { actor: me(), target: a.dataset.id });
    toast('Đã xóa điều khoản!');
    render();
  }
});

function initAll(){
  ['users','types','calls','subs','apps','mails','audit'].forEach(k=>DB[k].length=0);
  seed();
}
function boot(){initAll();render()}

const SYNC_ARR=['users','types','calls','subs','apps','mails','audit','guides','terms'];
function syncSnapshot(){return JSON.stringify({a:Object.fromEntries(SYNC_ARR.map(k=>[k,DB[k]])),seq:DB.seq,settings:DB.settings})}
function syncApply(json){
  const d=JSON.parse(json);
  SYNC_ARR.forEach(k=>{
    if(!DB[k]) DB[k]=[];
    DB[k].length=0;
    (d.a[k]||[]).forEach(x=>DB[k].push(x));
  });
  DB.seq=d.seq||{};
  DB.settings=d.settings||{...SETTINGS0};

  if(!DB.guides || DB.guides.length===0 || !DB.terms || DB.terms.length===0 || !DB.types || DB.types.length < 5){
    seed();
  }
}

boot();
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {getDatabase,ref,get,set,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const cfg={apiKey:"AIzaSyDiDeI3Q1p0s7TG8YkjycJZPOamka8t0LA",authDomain:"ias-portal-backup.firebaseapp.com",databaseURL:"https://ias-portal-backup-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"ias-portal-backup",storageBucket:"ias-portal-backup.firebasestorage.app",messagingSenderId:"201647944305",appId:"1:201647944305:web:0957842c00d31da11021d0"};
const el=document.createElement('div');el.style.cssText='position:fixed;right:10px;bottom:10px;z-index:9999;font:12px system-ui;padding:4px 8px;border-radius:6px;background:#eef2f7;color:#2b3a4a;border:1px solid #cfd8e3';document.body.appendChild(el);
const say=(t,bad)=>{el.textContent=t;el.style.background=bad?'#fde8e8':'#eef2f7'};
const cid=Math.random().toString(36).slice(2);
try{
  say('Đang kết nối Cloud DB…');
  const app=initializeApp(cfg);await signInAnonymously(getAuth(app));
  const db=getDatabase(app),r=ref(db,'ias/state');
  const first=await get(r);let last='',lastTs=0;
  if(first.exists()){const v=first.val();syncApply(v.json);last=syncSnapshot();lastTs=v.ts;render()}
  else{last=syncSnapshot();lastTs=Date.now();await set(r,{ts:lastTs,by:cid,json:last})}
  say('Đã kết nối Cloud');
  setInterval(async()=>{const cur=syncSnapshot();if(cur===last)return;try{const ts=Date.now();await set(r,{ts,by:cid,json:cur});last=cur;lastTs=ts}catch(e){say('Lỗi lưu cloud',true)}},3000);
  onValue(r,snap=>{const v=snap.val();if(!v||v.by===cid||v.ts<=lastTs)return;syncApply(v.json);last=syncSnapshot();lastTs=v.ts;render()});
}catch(e){console.error(e);say('Offline DB',true)}
</script>
